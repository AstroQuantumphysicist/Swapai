[project]
name = "swapai"
version = "0.1.0"
description = "SwapAI - the best Codex router. Multi-account Codex OAuth -> OpenAI-compatible API server with automatic failover."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
]

[project.scripts]
swapai = "swapai.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swapai*"]
